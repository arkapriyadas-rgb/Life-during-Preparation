<html lang="en">
<head>

<title>Beyond the Study Seat</title>
<meta name="description" content="A 2-minute anonymous academic survey for competitive-exam aspirants in Delhi NCR, aged 18 and above.">
<meta property="og:title" content="Life during Preparation">
<meta property="og:description" content="A 2-minute anonymous academic survey for competitive-exam aspirants in Delhi NCR, aged 18 and above. Just tap your answers.">

<style>
  :root{
    --violet:#783CF2; --violet-2:#8650FF; --lavender:#E9EBFF; --lilac:#F3EDFF;
    --white:#FFFFFF; --ink:#17151B; --muted:#57516A; --line:#D9D2F5; --error:#B3123A;
    --display:'Anton','Impact','Arial Narrow Bold',sans-serif;
    --ui:'Outfit','Segoe UI',Roboto,Arial,sans-serif;
    --soft:'Nunito','Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--violet-2);color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
  body{min-height:100vh}
  button,input,textarea{font:inherit;color:inherit}

  /* Decorative checkerboard: fixed behind everything, never under text */
  .checker{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .stage{position:relative;z-index:1;max-width:560px;margin:34px 14px 18px;background:var(--lilac);
    border-radius:30px;padding:20px 18px 0;min-height:calc(100vh - 52px);display:flex;flex-direction:column}
  @media (min-width:588px){ .stage{margin-left:auto;margin-right:auto} }
  @media (min-width:600px){ .stage{margin:36px auto;padding:28px 30px 0;min-height:0} }

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:12px;min-height:44px}
  .topbar .meta{flex:1;min-width:0}
  .section-line{font-family:var(--soft);font-size:14px;font-weight:700;color:var(--muted);margin:0 0 6px}
  .section-line b{color:var(--ink)}
  .bar{height:10px;border-radius:99px;background:var(--white);border:2px solid var(--ink);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .35s ease}
  .sticker{flex:none;width:44px;height:44px}

  /* Headline lock-up, after the reference's QUIZ / TIME */
  .lockup{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px 12px;margin:14px 0 0}
  .qnum{font-family:var(--display);font-size:96px;line-height:.86;letter-spacing:-.5px;margin:0;color:var(--ink)}
  .pill{display:inline-block;background:var(--white);color:var(--violet);border:3px solid var(--violet);
    border-radius:16px;padding:4px 14px 6px;font-family:var(--ui);font-weight:800;font-size:22px;line-height:1.1;
    transform:rotate(-3deg);box-shadow:4px 4px 0 var(--violet);margin-bottom:10px;white-space:nowrap}
  .doodle-row{height:44px;display:flex;justify-content:flex-end;padding-right:24px}
  .doodle-row svg{height:44px;width:110px}

  /* Welcome */
  .hero{font-family:var(--display);font-size:clamp(58px,17vw,86px);line-height:.9;margin:14px 0 0;letter-spacing:-.3px}
  .hero .line{display:block}
  .hero .pill{font-family:var(--display);font-size:.62em;font-weight:400;letter-spacing:.5px;padding:2px 14px 6px;
    vertical-align:middle;margin:0 0 0 6px;transform:rotate(-4deg) translateY(-6px)}
  .kicker{font-family:var(--soft);font-weight:700;font-size:14px;color:var(--muted);margin:0}

  /* Card */
  .card{background:var(--white);border-radius:26px;padding:22px 18px 20px;box-shadow:0 12px 30px rgba(120,60,242,.16)}
  @media (min-width:600px){ .card{padding:26px 24px 24px} }
  .context{display:flex;gap:10px;align-items:flex-start;background:var(--lavender);border-radius:16px;padding:12px 14px;
    font-family:var(--soft);font-weight:600;font-size:15px;line-height:1.4;margin:0 0 16px}
  .context svg{flex:none;margin-top:2px}
  .qtext{font-size:21px;line-height:1.3;font-weight:600;margin:0 0 10px}
  .helper{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px;font-family:var(--soft);font-size:14px;font-weight:700;color:var(--muted)}
  .count{background:var(--ink);color:var(--white);border-radius:99px;padding:3px 10px;font-family:var(--ui);font-weight:600}
  .count.full{background:var(--violet)}
  .tag{background:var(--lavender);color:var(--violet);border-radius:99px;padding:3px 10px}

  /* Answer options */
  .options{display:flex;flex-direction:column;gap:10px;margin:0;padding:0}
  .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px 10px 10px;border:0;border-radius:18px;
    background:var(--violet-2);color:var(--white);text-align:left;cursor:pointer;font-size:16px;font-weight:500;line-height:1.3;
    transition:background .15s ease, transform .1s ease;-webkit-tap-highlight-color:transparent}
  .opt:hover{background:var(--violet)}
  .opt:active{transform:scale(.99)}
  .opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .key{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--violet);color:var(--white);
    font-weight:700;font-size:15px;border-radius:50%}
  .multi .key{border-radius:9px}
  .key svg{display:none}
  .opt[aria-checked="true"]{background:var(--ink)}
  .opt[aria-checked="true"] .key{background:var(--white);color:var(--violet)}
  .opt[aria-checked="true"] .key span{display:none}
  .opt[aria-checked="true"] .key svg{display:block}
  .opt[aria-disabled="true"]{background:var(--lavender);color:var(--muted);cursor:not-allowed}
  .opt[aria-disabled="true"] .key{background:var(--line);color:var(--muted)}
  .opt .lbl{flex:1;min-width:0;overflow-wrap:anywhere}

  .picked{display:inline-block;background:var(--lavender);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin:0 0 14px;line-height:1.35}

  .navrow{display:flex;gap:10px}
  .nav.static{position:static;background:none}
  .note{font-family:var(--soft);font-size:14px;line-height:1.45;color:var(--muted);margin:-8px 0 16px}
  .linkbtn{display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:4px}
  .notice{margin:0 4px;font-family:var(--soft);font-weight:700;font-size:14px;color:var(--error)}
  .notice:empty{display:none}

  /* Welcome details */
  .subtitle{font-family:var(--soft);font-style:italic;font-weight:700;font-size:21px;color:var(--violet);margin:0 0 12px}
  .body{font-family:var(--soft);font-size:16px;line-height:1.55;margin:0 0 12px}
  .facts{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
  .facts li{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
  .facts svg{flex:none}
  .consent{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:14px;border-radius:16px;background:var(--lavender);cursor:pointer}
  .consent input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--violet)}
  .consent span{font-family:var(--soft);font-size:15px;line-height:1.45;font-weight:600}

  /* Navigation */
  .spacer{flex:1}
  .nav{position:sticky;bottom:0;display:flex;flex-direction:column;gap:10px;padding:16px 0 calc(16px + env(safe-area-inset-bottom));margin-top:18px;
    background:linear-gradient(to bottom, rgba(243,237,255,0), var(--lilac) 18px)}
  .btn{min-height:54px;border-radius:16px;padding:0 20px;font-weight:700;font-size:17px;cursor:pointer;border:2px solid var(--ink)}
  .btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
  .btn-primary{flex:1;background:var(--ink);color:var(--white)}
  .btn-primary:hover{background:#2b2733}
  .btn-ghost{background:var(--white);color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn-primary.soft{background:var(--white);color:var(--ink)}

  /* Review */
  .review{list-style:none;margin:0;padding:0}
  .review li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1.5px solid var(--lavender)}
  .review li:last-child{border-bottom:0}
  .review .q{font-size:14px;color:var(--muted);font-family:var(--soft);font-weight:600;line-height:1.35}
  .review .a{grid-column:1/2;font-weight:600;font-size:15px;line-height:1.4;overflow-wrap:anywhere;white-space:pre-line}
  .review .a.empty{color:var(--muted);font-weight:500;font-style:italic}
  .review .edit{grid-column:2/3;grid-row:1/3;align-self:center;background:var(--lavender);color:var(--violet);border:0;border-radius:12px;
    min-height:40px;padding:0 14px;font-weight:700;cursor:pointer}
  .review .edit:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .status{display:flex;gap:10px;align-items:flex-start;margin:0;padding:14px;border-radius:16px;background:#FFE8EE;color:var(--error);
    font-family:var(--soft);font-weight:700;font-size:15px;line-height:1.45}
  .spinner{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;display:inline-block;
    vertical-align:-3px;margin-right:10px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .thanks-title{font-family:var(--display);font-weight:400;font-size:clamp(42px,12.5vw,76px);line-height:.92;margin:18px 0 0;overflow-wrap:anywhere}
  .saved{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;margin:0 0 12px}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

var SURVEY = {"version":"2.0","sections":{"S1":{"order":1,"title":"About you"},"S2":{"order":2,"title":"Your most recent study day","instruction":"Think about the most recent day you studied, within the last 7 days."},"S3":{"order":3,"title":"One last thing"}},"questions":[{"id":"Q1","key":"age","section":"S1","type":"single","required":true,"typeLabel":"Single select","text":"What is your age group?","column":"Age Group","options":["18–20","21–23","24–26","27–30","31 and above","Under 18"],"endsIf":"Under 18","endMessage":"This survey is open to aspirants aged 18 and above, so we are not able to include your answers."},{"id":"Q2","key":"exams","section":"S1","type":"multi","required":true,"typeLabel":"Multi-select: select all that apply","text":"Which exam(s) are you preparing for?","column":"Examination(s)","options":["UPSC Civil Services","State PSC","SSC","Banking","Railways or Defence","NEET, JEE or other entrance exam","Other"]},{"id":"Q3","key":"stay","section":"S1","type":"single","required":true,"typeLabel":"Single select","text":"Where do you stay while preparing?","column":"Accommodation","options":["PG or hostel","Rented room (shared)","Rented room (alone)","Own or family home in Delhi NCR","Other"]},{"id":"Q4","key":"location","section":"S1","type":"single","required":true,"typeLabel":"Single select","text":"In which area is your main study space?","column":"Study Location","options":["Old Rajinder Nagar","Mukherjee Nagar","Gautam Nagar","Other area in Delhi NCR","No fixed place","Outside Delhi NCR"],"endsIf":"Outside Delhi NCR","endMessage":"This survey is about studying in Delhi NCR, so we are not able to include your answers."},{"id":"Q5","key":"arrangement","section":"S1","type":"single","required":true,"typeLabel":"Single select","text":"Where do you mostly study on your own?","column":"Primary Study Arrangement","options":["Private study library","Public library","Coaching institute or study centre","Room, PG or hostel","Own home","I move between <script>
(function () {
  'use strict';

  var Q = {};
  SURVEY.questions.forEach(function (q) { Q[q.id] = q; });
  var ORDER = SURVEY.questions.map(function (q) { return q.id; });
  var NONE = SURVEY.effortNone;
  var app = document.getElementById('app');
  var cryptoObj = window.crypto || window.msCrypto;

  function randInt(n) {
    var buf = new Uint32Array(1);
    cryptoObj.getRandomValues(buf);
    return buf[0] % n;
  }

  function newSubmissionId() {
    var bytes = new Uint8Array(16);
    cryptoObj.getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  /* Option order is shuffled once per participant (so Back does not reshuffle).
     "Other" and "Nothing..." options stay pinned at the bottom. */
  var DISPLAY_ORDER = {};
  SURVEY.questions.forEach(function (q) {
    if (!q.shuffle) return;
    var pinned = q.pinned || [];
    var free = q.options.filter(function (o) { return pinned.indexOf(o) < 0; });
    for (var i = free.length - 1; i > 0; i--) {
      var j = randInt(i + 1); var t = free[i]; free[i] = free[j]; free[j] = t;
    }
    DISPLAY_ORDER[q.id] = free.concat(q.options.filter(function (o) { return pinned.indexOf(o) >= 0; }));
  });

  var state = {
    screen: 'welcome',
    consent: false,
    submissionId: newSubmissionId(),
    submitting: false,
    submitted: false,
    returnToReview: false,
    exitFrom: null,
    error: '',
    a: { age: null, exams: [], stay: null, location: null, arrangement: null, places: [], effort: [],
         significant: null, effect: null, coping: [], helped: [], easier: [], interview: null }
  };

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function letter(i) { return String.fromCharCode(65 + i); }
  function noEffort() { return state.a.effort.indexOf(NONE) >= 0; }
  function q8Auto() { return !noEffort() && state.a.effort.length === 1; }

  function skipped(id) {
    var q = Q[id];
    if (q.skipIfNone && noEffort()) return true;
    if (id === 'Q8' && q8Auto()) return true;   // only one aspect picked: it is the answer
    return false;
  }

  function steps() { return ORDER.filter(function (id) { return !skipped(id); }); }

  function isComplete(id) {
    var q = Q[id], v = state.a[q.key];
    if (!q.required) return true;
    if (q.type === 'multi') return v.length > 0;
    if (q.type === 'derived-single') return v != null && state.a.effort.indexOf(v) >= 0;
    return v != null;
  }

  function optionsFor(q) {
    var base = DISPLAY_ORDER[q.id] || q.options;
    if (q.type === 'derived-single') {
      return base.filter(function (o) { return state.a.effort.indexOf(o) >= 0; });
    }
    return base;
  }

  function mostSignificant() { return q8Auto() ? state.a.effort[0] : state.a.significant; }

  var ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3.5 9.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var STICKER = '<svg class="sticker" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#783CF2"/><path d="M22 9c1.6 7 4 9.4 11 11-7 1.6-9.4 4-11 11-1.6-7-4-9.4-11-11 7-1.6 9.4-4 11-11z" fill="#fff"/></svg>';
  var ARROW = '<div class="doodle-row" aria-hidden="true"><svg viewBox="0 0 110 44"><path d="M104 6 C 86 30, 54 34, 22 26" fill="none" stroke="#17151B" stroke-width="2.4" stroke-dasharray="6 6" stroke-linecap="round"/><path d="M30 17 L 18 25 L 30 34" fill="none" stroke="#17151B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
  var ICON_CLOCK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#783CF2" stroke-width="2"/><path d="M10 5.5V10l3 2" fill="none" stroke="#783CF2" stroke-width="2" stroke-linecap="round"/></svg>';
  var ICON_LOCK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="#783CF2" stroke-width="2"/><path d="M7 9V6.5a3 3 0 016 0V9" fill="none" stroke="#783CF2" stroke-width="2"/></svg>';
  var ICON_TICK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5" fill="none" stroke="#783CF2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_PERSON = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3.2" fill="none" stroke="#783CF2" stroke-width="2"/><path d="M3.5 17c.8-3.4 3.3-5 6.5-5s5.7 1.6 6.5 5" fill="none" stroke="#783CF2" stroke-width="2" stroke-linecap="round"/></svg>';

  function fact(icon, text) { return '<li>' + icon + '<span>' + esc(text) + '</span></li>'; }

  /* ---------- screens ---------- */
  function render() {
    var s = state.screen;
    if (s === 'welcome') return renderWelcome();
    if (s === 'exit') return renderExit();
    if (s === 'review') return renderReview();
    if (s === 'thanks') return renderThanks();
    return renderQuestion(s);
  }

  function renderWelcome() {
    app.innerHTML =
      '<div class="topbar"><div class="meta"><p class="kicker">A short academic research survey</p></div>' + STICKER + '</div>' +
      '<h1 class="hero"><span class="line">BEYOND THE</span><span class="line">STUDY <span class="pill">SEAT</span></span></h1>' +
      ARROW +
      '<section class="card">' +
        '<p class="subtitle">Every study day has a story.</p>' +
        '<p class="body">We are exploring the everyday experiences of competitive-exam aspirants in Delhi: the spaces they use, the services they depend on and the little things that shape their study routines.</p>' +
        '<ul class="facts">' +
          fact(ICON_CLOCK, 'About 2 minutes, just tap your answers') +
          fact(ICON_LOCK, 'Anonymous: no name, email or phone number') +
          fact(ICON_PERSON, 'For aspirants aged 18 and above') +
          fact(ICON_TICK, 'Academic research, with no right or wrong answers') +
        '</ul>' +
        '<label class="consent"><input type="checkbox" id="consent"' + (state.consent ? ' checked' : '') + '>' +
        '<span>I am taking part voluntarily. I understand my responses are anonymous and will be used only for academic research.</span></label>' +
      '</section>' +
      '<div class="spacer"></div>' +
      '<nav class="nav static"><div class="navrow"><button class="btn btn-primary" id="start"' + (state.consent ? '' : ' disabled') + '>Start the survey</button></div></nav>';
    var cb = document.getElementById('consent');
    var start = document.getElementById('start');
    cb.addEventListener('change', function () { state.consent = cb.checked; start.disabled = !cb.checked; });
    start.addEventListener('click', function () { if (state.consent) go('Q1'); });
  }

  function renderExit() {
    var q = Q[state.exitFrom];
    app.innerHTML =
      '<div class="topbar"><div class="meta"><p class="kicker">About you</p></div>' + STICKER + '</div>' +
      '<h1 class="thanks-title">THANK YOU FOR YOUR INTEREST</h1>' + ARROW +
      '<section class="card"><p class="body">' + esc(q.endMessage) + '</p>' +
      '<p class="body" style="margin:0">Nothing you entered has been saved.</p></section>' +
      '<div class="spacer"></div>' +
      '<nav class="nav"><div class="navrow"><button class="btn btn-ghost" id="back">Change my answer</button></div></nav>';
    document.getElementById('back').addEventListener('click', function () { go(state.exitFrom); });
  }

  function typeTag(q) {
    if (!q.required) return 'Optional';
    if (q.type === 'multi') return q.max ? 'Up to ' + q.max : 'Pick any';
    return 'Pick one';
  }

  function renderQuestion(id) {
    var q = Q[id];
    var list = steps();
    var idx = list.indexOf(id);
    var sec = SURVEY.sections[q.section];
    var pct = Math.round((idx / list.length) * 100);
    var isMulti = q.type === 'multi';
    var opts = optionsFor(q);

    var html =
      '<div class="topbar"><div class="meta">' +
        '<p class="section-line">Part ' + sec.order + ' of 3: <b>' + esc(sec.title) + '</b></p>' +
        '<div class="bar" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + Math.max(pct, 4) + '%"></i></div>' +
      '</div>' + STICKER + '</div>' +
      '<div class="lockup"><p class="qnum" aria-hidden="true">' + esc(id) + '</p><span class="pill">' + esc(typeTag(q)) + '</span></div>' +
      ARROW +
      '<section class="card" aria-labelledby="qt">';

    if (sec.instruction && (id === 'Q6' || id === 'Q7')) {
      html += '<p class="context">' + ICON_CLOCK + '<span>' + esc(sec.instruction) + '</span></p>';
    }
    if (id === 'Q9' && mostSignificant()) {
      html += '<p class="picked">About: ' + esc(mostSignificant()) + '</p>';
    }

    html += '<h2 class="qtext" id="qt"><span class="sr">Question ' + id.slice(1) + '. </span>' + esc(q.text) + '</h2>' +
            '<div class="helper"><span>' + esc(q.typeLabel) + '</span>' +
            (q.max ? '<span class="count" id="count"></span>' : '') +
            (!q.required ? '<span class="tag">Optional</span>' : '') + '</div>';
    if (q.type === 'derived-single') html += '<p class="note">Showing the options you selected in Question 7.</p>';
    if (q.note) html += '<p class="note">' + esc(q.note) + '</p>';

    html += '<div class="options ' + (isMulti ? 'multi' : 'single') + '" role="' + (isMulti ? 'group' : 'radiogroup') + '" aria-labelledby="qt">' +
      opts.map(function (opt, i) {
        return '<button type="button" class="opt" role="' + (isMulti ? 'checkbox' : 'radio') + '" data-opt="' + esc(opt) + '" aria-checked="false">' +
               '<span class="key"><span>' + letter(i) + '</span>' + ICON_CHECK + '</span><span class="lbl">' + esc(opt) + '</span></button>';
      }).join('') + '</div>';

    html += '</section><div class="spacer"></div>' +
      '<nav class="nav"><div class="notice" id="notice" role="alert"></div><div class="navrow"><button class="btn btn-ghost" id="back">Back</button>' +
      '<button class="btn btn-primary" id="next">' + (state.returnToReview ? 'Back to review' : (idx === list.length - 1 ? 'Review answers' : 'Next')) + '</button></div></nav>';

    app.innerHTML = html;
    wireQuestion(q);
  }

  function wireQuestion(q) {
    var notice = document.getElementById('notice');
    document.getElementById('back').addEventListener('click', back);
    document.getElementById('next').addEventListener('click', next);
    var buttons = Array.prototype.slice.call(app.querySelectorAll('.opt'));
    buttons.forEach(function (b) {
      b.addEventListener('click', function () {
        notice.textContent = '';
        choose(q, b.getAttribute('data-opt'), notice);
        syncOptions(q, buttons);
      });
    });
    syncOptions(q, buttons);
  }

  function choose(q, opt, notice) {
    var a = state.a;
    if (q.type !== 'multi') {
      // Optional questions can be cleared by tapping the chosen answer again.
      a[q.key] = (!q.required && a[q.key] === opt) ? null : opt;
      return;
    }
    var arr = a[q.key].slice();
    var at = arr.indexOf(opt);
    if (at >= 0) {
      arr.splice(at, 1);
    } else if (q.exclusive && opt === q.exclusive) {
      arr = [opt];
    } else {
      arr = arr.filter(function (x) { return x !== q.exclusive; });
      if (q.max && arr.length >= q.max) {
        notice.textContent = 'You can choose up to ' + q.max + '. Remove one to pick another.';
        return;
      }
      arr.push(opt);
    }
    arr.sort(function (x, y) { return q.options.indexOf(x) - q.options.indexOf(y); });
    a[q.key] = arr;
    if (q.id === 'Q7') {
      if (a.significant != null && arr.indexOf(a.significant) < 0) a.significant = null;
      if (arr.indexOf(NONE) >= 0) { a.significant = null; a.effect = null; }
    }
  }

  function syncOptions(q, buttons) {
    var v = state.a[q.key];
    var multi = q.type === 'multi';
    var full = multi && q.max && v.length >= q.max;
    buttons.forEach(function (b) {
      var opt = b.getAttribute('data-opt');
      var on = multi ? v.indexOf(opt) >= 0 : v === opt;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      var dim = full && !on && opt !== q.exclusive;
      if (dim) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    });
    var count = document.getElementById('count');
    if (count) {
      var n = v.indexOf(q.exclusive) >= 0 ? 0 : v.length;
      count.textContent = n + ' of ' + q.max + ' chosen';
      count.className = 'count' + (n >= q.max ? ' full' : '');
    }
  }

  /* ---------- navigation ---------- */
  function go(screen) {
    state.screen = screen;
    render();
    window.scrollTo(0, 0);
    var h = app.querySelector('h1, h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  function firstIncomplete() {
    var list = steps();
    for (var i = 0; i < list.length; i++) if (!isComplete(list[i])) return list[i];
    return null;
  }

  function next() {
    var id = state.screen, q = Q[id];
    var notice = document.getElementById('notice');
    if (!isComplete(id)) {
      notice.textContent = q.type === 'multi' ? 'Choose at least one option to continue.' : 'Choose an option to continue.';
      return;
    }
    if (q.endsIf && state.a[q.key] === q.endsIf) { state.exitFrom = id; return go('exit'); }
    if (state.returnToReview) {
      var gap = firstIncomplete();
      if (gap) return go(gap);
      state.returnToReview = false;
      return go('review');
    }
    var list = steps();
    var i = list.indexOf(id);
    go(i < list.length - 1 ? list[i + 1] : 'review');
  }

  function back() {
    var list = steps();
    var i = list.indexOf(state.screen);
    go(i > 0 ? list[i - 1] : 'welcome');
  }

  /* ---------- review & submit ---------- */
  function answerText(id) {
    var q = Q[id], v = state.a[q.key];
    if (q.type === 'multi') return v.join('\n');
    if (q.type === 'derived-single') return mostSignificant() || '';
    return v || '';
  }

  function renderReview() {
    var ids = steps();
    if (q8Auto() && ids.indexOf('Q9') >= 0) ids.splice(ids.indexOf('Q9'), 0, 'Q8');
    var items = ids.map(function (id) {
      var q = Q[id];
      var ans = answerText(id);
      var auto = id === 'Q8' && q8Auto();
      return '<li><span class="q">' + esc(id) + '. ' + esc(q.text) + '</span>' +
             '<span class="a' + (ans ? '' : ' empty') + '">' + (ans ? esc(ans) : 'No answer (optional)') +
             (auto ? '<br><span style="font-weight:500;color:var(--muted)">Your only answer to Q7</span>' : '') + '</span>' +
             '<button class="edit" data-go="' + (auto ? 'Q7' : id) + '" aria-label="Change answer to ' + esc(id) + '">Change</button></li>';
    }).join('');

    app.innerHTML =
      '<div class="topbar"><div class="meta"><p class="section-line"><b>Check your answers</b></p>' +
      '<div class="bar" aria-hidden="true"><i style="width:100%"></i></div></div>' + STICKER + '</div>' +
      '<h1 class="thanks-title">ALMOST THERE</h1>' + ARROW +
      '<section class="card"><p class="body" style="margin:0 0 4px">Check your answers before you submit. Use Change to edit any of them.</p><ul class="review">' + items + '</ul></section>' +
      '<div class="spacer"></div>' +
      '<nav class="nav">' + (state.error ? '<div class="status" role="alert">' + esc(state.error) + '</div>' : '') +
      '<div class="navrow"><button class="btn btn-ghost" id="back"' + (state.submitting ? ' disabled' : '') + '>Back</button>' +
      '<button class="btn btn-primary" id="submit"' + (state.submitting ? ' disabled' : '') + '>' +
      (state.submitting ? '<span class="spinner" aria-hidden="true"></span>Saving your response' : 'Submit my responses') + '</button></div></nav>';

    Array.prototype.forEach.call(app.querySelectorAll('.edit'), function (b) {
      b.disabled = state.submitting;
      b.addEventListener('click', function () { state.returnToReview = true; state.error = ''; go(b.getAttribute('data-go')); });
    });
    document.getElementById('back').addEventListener('click', function () { state.error = ''; go(steps()[steps().length - 1]); });
    document.getElementById('submit').addEventListener('click', submit);
  }

  function payload() {
    var a = state.a, none = noEffort();
    return {
      submissionId: state.submissionId,
      consent: state.consent === true,
      answers: {
        age: a.age, exams: a.exams, stay: a.stay, location: a.location, arrangement: a.arrangement,
        places: a.places, effort: a.effort,
        significant: none ? null : mostSignificant(),
        effect: none ? null : a.effect,
        coping: a.coping, helped: a.helped, easier: a.easier,
        interview: a.interview || ''
      }
    };
  }

  /* Sends the response to the Apps Script backend. Works in two setups:
     - served by Apps Script itself: google.script.run
     - hosted elsewhere (e.g. GitHub Pages): HTTPS POST to the /exec URL in SURVEY_ENDPOINT */
  function send(p, done, fail) {
    if (window.SURVEY_ENDPOINT) {
      fetch(window.SURVEY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // simple request: no CORS preflight
        body: JSON.stringify(p),
        redirect: 'follow'
      })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(done)
        .catch(fail);
      return;
    }
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitResponse(p);
      return;
    }
    fail(new Error('not connected'));
  }

  var watchdog = null;
  function submit() {
    if (state.submitting || state.submitted) return;
    var gap = firstIncomplete();
    if (gap) { state.returnToReview = true; return go(gap); }
    if (!window.SURVEY_ENDPOINT && !(window.google && google.script && google.script.run)) {
      state.error = 'This page is not connected to the survey server, so your response cannot be saved here. Please open the survey from the link you were sent.';
      return renderReview();
    }
    state.submitting = true; state.error = '';
    renderReview();
    watchdog = setTimeout(function () {
      if (!state.submitting) return;
      state.submitting = false;
      state.error = 'Saving is taking longer than expected. Check your connection and press Submit again. Your answers will not be recorded twice.';
      renderReview();
    }, 45000);
    send(payload(), function (res) {
      clearTimeout(watchdog);
      if (state.submitted) return;
      state.submitting = false;
      if (res && res.ok === true) {
        state.submitted = true;
        if (res.contactUrl && /^https:\/\/\S+$/.test(res.contactUrl)) state.contactUrl = res.contactUrl;
        go('thanks');
      } else {
        state.error = (res && res.message) ? res.message : 'Your response could not be saved. Please try again.';
        renderReview();
      }
    }, function () {
      clearTimeout(watchdog);
      if (state.submitted) return;
      state.submitting = false;
      state.error = 'Your response could not be saved because the connection failed. Your answers are still here; press Submit again.';
      renderReview();
    });
  }

  function renderThanks() {
    var contact = '';
    var contactUrl = state.contactUrl || SURVEY.contactUrl;
    if (state.a.interview === 'Yes' && contactUrl) {
      contact = '<section class="card" style="margin-top:14px"><p class="saved" style="margin-bottom:6px">Thank you for offering to chat.</p>' +
        '<p class="body">Share your contact details on a separate form. It is not connected to your answers here, so this survey stays anonymous.</p>' +
        '<a class="btn btn-primary linkbtn" href="' + esc(contactUrl) + '" target="_blank" rel="noopener noreferrer">Open the contact form</a></section>';
    }
    app.innerHTML =
      '<div class="topbar"><div class="meta"><div class="bar" aria-hidden="true"><i style="width:100%"></i></div></div>' + STICKER + '</div>' +
      '<h1 class="thanks-title">THANK YOU FOR PARTICIPATING!</h1>' + ARROW +
      '<section class="card"><p class="saved">' + ICON_CHECK.replace('currentColor', '#783CF2') + '<span>Your response has been saved.</span></p>' +
      '<p class="body">Your responses will help us better understand the everyday experiences of competitive-exam aspirants and identify opportunities to improve the spaces, services and interactions that support their preparation.</p>' +
      '<p class="body" style="margin:0;color:var(--muted)">You can close this page now.</p></section>' + contact +
      '<div class="spacer"></div><div style="height:24px"></div>';
  }

  window.addEventListener('beforeunload', function (e) {
    var started = state.screen !== 'welcome' && state.screen !== 'thanks' && state.screen !== 'exit';
    if (started && !state.submitted) { e.preventDefault(); e.returnValue = ''; }
  });

  render();
})();
</script>
</body>
</html>
